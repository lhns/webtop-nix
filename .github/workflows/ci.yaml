name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Main runs get a group per commit, so no publish is cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lhns/webtop-nix

jobs:
  nix:
    # Native builds per system, no emulation. The VM tests need KVM, which the arm runners lack
    # (kube-webtop-workspaces boot-tests the image on both).
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            vm: true
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    # A cold run builds KWin (25–45 min on x86_64); with the cache it takes minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Evaluating the module realises the stock Plasma closure (the KWin graft reads its references).
      # The image is loaded into docker as well.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /

      # The VM test needs /dev/kvm, and the Nix daemon only offers the kvm feature if it exists when it starts.
      - name: enable KVM
        if: matrix.vm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The cache below is a local binary cache of the patched KWin closure (the rest of the build comes from
      # cache.nixos.org). Signatures are not checked: only this repo's workflows write that cache.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/kwin-cache file:///home/runner/nix-cache
            require-sigs = false

      # The key is the store path of the patched KWin, i.e. a hash of its derivation: the patch,
      # nixpkgs and flake.lock all change it.
      - name: patched KWin store path
        id: kwin
        run: |
          out=$(nix eval --raw .#kwin.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=kwin-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      # Evaluating may make the nix daemon (root) create files in the cache directory; start clean so
      # the restore, which runs as the user, can write.
      - name: empty cache directory
        run: |
          sudo rm -rf ~/kwin-cache
          mkdir ~/kwin-cache
      - name: restore patched KWin
        id: kwin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}
      - name: build patched KWin
        run: nix build .#kwin -L --no-link
      # The whole closure: a binary cache refuses a path whose references it lacks. zstd keeps it small.
      - name: save patched KWin
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        # The daemon (root) created parts of the directory while substituting.
        run: |
          sudo chown -R "$USER" ~/kwin-cache
          nix copy --to "file://$HOME/kwin-cache?compression=zstd" "${{ steps.kwin.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}

      # The same for the patched Nix (services.webtop.nixProfile), built from source. Its own key: its
      # changes must not cost a KWin build.
      - name: patched Nix store path
        id: nixpkg
        run: |
          out=$(nix eval --raw .#nix-profile-backends.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=nix-profile-backends-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - name: empty patched Nix cache directory
        run: |
          sudo rm -rf ~/nix-cache
          mkdir ~/nix-cache
      - name: restore patched Nix
        id: nix-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/nix-cache
          key: ${{ steps.nixpkg.outputs.key }}
      - name: build patched Nix
        run: nix build .#nix-profile-backends -L --no-link
      - name: save patched Nix
        if: steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          sudo chown -R "$USER" ~/nix-cache
          nix copy --to "file://$HOME/nix-cache?compression=zstd" "${{ steps.nixpkg.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.nix-cache.outputs.cache-hit != 'true'
        with:
          path: ~/nix-cache
          key: ${{ steps.nixpkg.outputs.key }}

      # `nix flake check --no-build` cannot evaluate the system: the graft reads the stock closure's
      # references (import from derivation), which needs a build of that system, hence native runners.
      - name: layer split unit test
        run: python3 tests/split-layers-test.py
      - name: starter template upgrade test
        run: bash tests/nix-profile-template-test.sh
      - name: nixpkgs-unfree test
        run: bash tests/nixpkgs-unfree-test.sh
      - name: reinstall test
        run: bash tests/nix-profile-reinstall-test.sh
      - name: build packages and module-eval
        run: nix build .#pixelflux .#pcmflux .#selkies .#webtop-app-screen .#nix-software-center .#nix-software-center-pkgdb .#checks.${{ matrix.system }}.module-eval .#checks.${{ matrix.system }}.included-manifest -L
