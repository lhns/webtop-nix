name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Evaluating the module realises the stock Plasma closure (the KWin graft reads its references).
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # The cache below is a local binary cache of the patched KWin alone; its dependencies come from
      # cache.nixos.org. Signatures are not checked: only this repo's workflows write that cache.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/kwin-cache
            require-sigs = false

      # The key is the store path of the patched KWin, i.e. a hash of its derivation: the patch,
      # nixpkgs and flake.lock all change it.
      - name: patched KWin store path
        id: kwin
        run: |
          out=$(nix eval --raw .#kwin.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=kwin-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - name: restore patched KWin
        id: kwin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}
      - name: build patched KWin
        run: |
          mkdir -p ~/kwin-cache
          nix build .#kwin -L --no-link
      # --no-recursive: references are fetched from cache.nixos.org, the cache holds one path.
      - name: save patched KWin
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        run: nix copy --no-recursive --to file://$HOME/kwin-cache "${{ steps.kwin.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}

      - name: nix flake check
        run: nix flake check --no-build -L
      - name: build packages and module eval check
        run: nix build .#pixelflux .#pcmflux .#selkies .#checks.x86_64-linux.module-eval -L
