name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Main runs get a group per commit, so no publish is cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lhns/webtop-nix

jobs:
  nix:
    # Native builds per system, no emulation. The VM tests need KVM, which the arm runners lack
    # (kube-webtop-workspaces boot-tests the image on both).
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            vm: true
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            vm: false
    name: nix (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    # A cold run builds KWin (25–45 min on x86_64); with the cache it takes minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Evaluating the module realises the stock Plasma closure (the KWin graft reads its references).
      # The image is loaded into docker as well.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /

      # The VM test needs /dev/kvm, and the Nix daemon only offers the kvm feature if it exists when it starts.
      - name: enable KVM
        if: matrix.vm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The cache below is a local binary cache of the patched KWin closure (the rest of the build comes from
      # cache.nixos.org). Signatures are not checked: only this repo's workflows write that cache.
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/kwin-cache file:///home/runner/nix-cache
            require-sigs = false

      # The key is the store path of the patched KWin, i.e. a hash of its derivation: the patch,
      # nixpkgs and flake.lock all change it.
      - name: patched KWin store path
        id: kwin
        run: |
          out=$(nix eval --raw .#kwin.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=kwin-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      # Evaluating may make the nix daemon (root) create files in the cache directory; start clean so
      # the restore, which runs as the user, can write.
      - name: empty cache directory
        run: |
          sudo rm -rf ~/kwin-cache
          mkdir ~/kwin-cache
      - name: restore patched KWin
        id: kwin-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}
      - name: build patched KWin
        run: nix build .#kwin -L --no-link
      # The whole closure: a binary cache refuses a path whose references it lacks. zstd keeps it small.
      - name: save patched KWin
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        # The daemon (root) created parts of the directory while substituting.
        run: |
          sudo chown -R "$USER" ~/kwin-cache
          nix copy --to "file://$HOME/kwin-cache?compression=zstd" "${{ steps.kwin.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.kwin-cache.outputs.cache-hit != 'true'
        with:
          path: ~/kwin-cache
          key: ${{ steps.kwin.outputs.key }}

      # The same for the patched Nix (services.webtop.nixProfile), built from source. Its own key: its
      # changes must not cost a KWin build.
      - name: patched Nix store path
        id: nixpkg
        run: |
          out=$(nix eval --raw .#nix-profile-backends.outPath)
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "key=nix-profile-backends-$(basename "$out" | cut -d- -f1)" >> "$GITHUB_OUTPUT"
      - name: empty patched Nix cache directory
        run: |
          sudo rm -rf ~/nix-cache
          mkdir ~/nix-cache
      - name: restore patched Nix
        id: nix-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/nix-cache
          key: ${{ steps.nixpkg.outputs.key }}
      - name: build patched Nix
        run: nix build .#nix-profile-backends -L --no-link
      - name: save patched Nix
        if: steps.nix-cache.outputs.cache-hit != 'true'
        run: |
          sudo chown -R "$USER" ~/nix-cache
          nix copy --to "file://$HOME/nix-cache?compression=zstd" "${{ steps.nixpkg.outputs.out }}"
      - uses: actions/cache/save@v6
        if: steps.nix-cache.outputs.cache-hit != 'true'
        with:
          path: ~/nix-cache
          key: ${{ steps.nixpkg.outputs.key }}
      - name: nix profile concurrency test
        timeout-minutes: 60
        run: bash tests/nix-profile-concurrency.sh "${{ steps.nixpkg.outputs.out }}"

      # `nix flake check --no-build` cannot evaluate the system: the graft reads the stock closure's
      # references (import from derivation), which needs a build of that system, hence native runners.
      - name: layer split unit test
        run: python3 tests/split-layers-test.py
      - name: starter template upgrade test
        run: bash tests/nix-profile-template-test.sh
      - name: nixpkgs-unfree test
        run: bash tests/nixpkgs-unfree-test.sh
      - name: reinstall test
        run: bash tests/nix-profile-reinstall-test.sh
      - name: build packages and module-eval
        run: nix build .#pixelflux .#pcmflux .#selkies .#webtop-app-screen .#nix-software-center .#nix-software-center-pkgdb .#checks.${{ matrix.system }}.module-eval -L
      - name: VM test
        if: matrix.vm
        run: nix build .#checks.${{ matrix.system }}.vm -L

      # Run outside the sandbox so its screenshots and logs survive a failure as an artifact.
      - name: second display test
        if: matrix.vm
        run: |
          nix build .#checks.${{ matrix.system }}.second-display.driver -L -o second-display-driver
          mkdir -p second-display
          ./second-display-driver/bin/nixos-test-driver -o second-display
      - uses: actions/upload-artifact@v4
        if: always() && matrix.vm
        with:
          name: second-display
          path: second-display
          if-no-files-found: ignore

      # The same, for which page owns the primary display.
      - name: latest owner test
        if: matrix.vm
        run: |
          nix build .#checks.${{ matrix.system }}.latest-owner.driver -L -o latest-owner-driver
          mkdir -p latest-owner
          ./latest-owner-driver/bin/nixos-test-driver -o latest-owner
      - uses: actions/upload-artifact@v4
        if: always() && matrix.vm
        with:
          name: latest-owner
          path: latest-owner
          if-no-files-found: ignore

      # ------ standalone image (README, "Image") ------
      - name: build image
        run: nix build .#image .#image.layerSplit -L -o img
      - name: layer table
        run: |
          {
            echo "### image (${{ matrix.system }})"
            nix run .#layer-report -- img img-1/groups.json --previous "$IMAGE:main"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: load image into docker
        run: |
          nix run .#image.copyToDockerDaemon
          docker image inspect -f '{{.Architecture}}' "$IMAGE:dev"
      - name: image boot test
        timeout-minutes: 15
        run: tests/image-boot.sh "$IMAGE:dev" 600
      - name: image boot diagnostics
        if: failure()
        run: |
          docker exec webtop-image systemctl --failed --no-pager || true
          docker exec webtop-image systemctl status webtop-session --no-pager -n 40 || true
          docker exec webtop-image journalctl -b --no-pager -g 'kwin|startplasma|wayland|webtop-session' 2>&1 | head -n 200 || true
          docker exec webtop-image sh -c 'findmnt -l; ls -la /run/user/1000; ps -eo user,pid,etime,args' || true
          docker exec webtop-image journalctl -b --no-pager _UID=1000 2>&1 | head -n 250 || true
          docker rm -f webtop-image || true

      # By digest (the form kube-webtop-workspaces publishes with); the index job tags it. zstd at a fixed level with the pinned skopeo: the same
      # layer gives the same blob on every run, so unchanged layers are reused by digest.
      - name: push image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix run .#image.copyTo -- --dest-compress-format zstd --dest-compress-level 6 --digestfile digest \
            --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${IMAGE}@@unknown-digest@@"
          mkdir -p out && cp digest "out/${{ matrix.system }}"
          REGISTRY_AUTH="${{ github.actor }}:${GHCR_TOKEN}" nix run .#layer-report -- img img-1/groups.json \
            --previous "$IMAGE:main" --pushed "$IMAGE@$(cat digest)" | tee -a "$GITHUB_STEP_SUMMARY" || echo "layer report failed (informational)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.system }}
          path: out/${{ matrix.system }}

  # One multi-arch index over the per-system images, tagged main and sha-<sha7>, signed keyless.
  image-index:
    if: github.event_name == 'push'
    needs: nix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create index
        id: index
        run: |
          set -euo pipefail
          args=(-t "$IMAGE:main" -t "$IMAGE:sha-${GITHUB_SHA::7}")
          for f in digests/*; do args+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image: \`$IMAGE:sha-${GITHUB_SHA::7}@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: cosign sign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # Rekor/Fulcio fail transiently; retry the whole call.
          for i in 1 2 3 4 5; do
            cosign sign --recursive "$IMAGE@${{ steps.index.outputs.digest }}" && exit 0
            echo "cosign sign failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1
