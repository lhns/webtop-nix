name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A branch run tests only: publishing is gated on push.
  workflow_dispatch:

# Main runs get a group per commit, so no publish is cancelled midway.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lhns/webtop-nix

# One build job per system; the test jobs take its store from an artifact (a file:// binary cache) and run
# in parallel. The concurrency and script tests need only the patched Nix and start at once.
# Native builds per system, no emulation. The VM tests need KVM, which the arm runners lack
# (a consumer boot-tests the image on both).
jobs:
  # The touch key bar of the web client, in mobile-emulated Chromium against a stub of the client's key input.
  # A real Android keyboard is not covered.
  key-bar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: key bar test
        run: |
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install --quiet playwright
          "$RUNNER_TEMP/pw/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/pw/bin/python" tests/key-bar-test.py

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: build (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    # A cold run builds KWin (25–45 min on x86_64); with the cache it takes minutes.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Evaluating the module realises the stock Plasma closure (the KWin graft reads its references), and
      # the export below holds the whole closure once more.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
          sudo docker image prune --all --force > /dev/null
          df -h /

      - uses: ./.github/actions/nix
        with:
          save: 'true'

      # skopeo's source patch, from the repo: github.com answers 429 to CI (see flake.nix).
      - name: seed skopeo patch
        run: nix build .#skopeo-patch --no-link -L

      # Cached across runs by store path (.github/actions/cache-package); the rest of the build comes from
      # cache.nixos.org. The patched KWin takes 25-45 min to build, pixelflux and nix-software-center 10-16.
      - uses: ./.github/actions/cache-package
        with:
          attr: kwin
      - uses: ./.github/actions/cache-package
        with:
          attr: pixelflux
      - uses: ./.github/actions/cache-package
        with:
          attr: pcmflux
      - uses: ./.github/actions/cache-package
        with:
          attr: nix-software-center

      # `nix flake check --no-build` cannot evaluate the system: the graft reads the stock closure's
      # references (import from derivation), which needs a build of that system, hence native runners.
      - name: build packages and module-eval
        run: nix build .#pixelflux .#pcmflux .#selkies .#webtop-app-screen .#webtop-power .#nix-software-center .#nix-software-center-pkgdb .#checks.${{ matrix.system }}.module-eval .#checks.${{ matrix.system }}.container-eval .#checks.${{ matrix.system }}.included-manifest .#checks.${{ matrix.system }}.store-overlay-layout -L
      - name: key bar in the built client
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build .#selkies -o selkies-out
          python3 -m venv "$RUNNER_TEMP/pw"
          "$RUNNER_TEMP/pw/bin/pip" install --quiet playwright
          "$RUNNER_TEMP/pw/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/pw/bin/python" tests/key-bar-test.py --built "$(echo selkies-out/lib/python*/site-packages/selkies/selkies_web)"
      # The drivers hold the test systems; the vm jobs run the tests.
      - name: build VM test drivers
        if: matrix.system == 'x86_64-linux'
        run: nix build .#checks.${{ matrix.system }}.{vm,defaults,relogin,lock,power,app-screens,second-display,latest-owner}.driver -L --no-link
      - name: build image
        run: nix build .#image .#image.layerSplit .#image.copyToDockerDaemon .#image.copyTo .#layer-report -L --no-link

      # Everything built here, import-from-derivation outputs included, with its closure (a binary cache
      # refuses a path whose references it lacks): the test jobs then build nothing they share.
      - name: export the build
        run: |
          sudo rm -rf ~/build-cache
          nix path-info --all --json \
            | jq -r 'if type == "array" then .[] | select(.ultimate) | .path else to_entries[] | select(.value.ultimate) | .key end' \
            | grep -v '\.drv$' > "$RUNNER_TEMP/built"
          wc -l < "$RUNNER_TEMP/built"
          xargs nix copy --to "file://$HOME/build-cache?compression=zstd&parallel-compression=true" < "$RUNNER_TEMP/built"
          du -sh ~/build-cache
      # Already zstd; kept for the run only.
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.system }}
          path: ~/build-cache
          compression-level: 0
          retention-days: 1

  # Script tests of the patched Nix, the layer split and the nix-profile templates.
  nix-scripts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: nix scripts (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        id: nix
      - name: nix daemon EOF test
        timeout-minutes: 10
        run: bash tests/nix-daemon-eof-test.sh "${{ steps.nix.outputs.nix }}"
      - name: layer split unit test
        run: python3 tests/split-layers-test.py
      - name: starter template upgrade test
        continue-on-error: true
        run: bash tests/nix-profile-template-test.sh
      - name: defaults input and relock test
        timeout-minutes: 10
        run: bash tests/defaults-input-test.sh "${{ steps.nix.outputs.nix }}"
      - name: nixpkgs-unfree test
        run: bash tests/nixpkgs-unfree-test.sh
      - name: reinstall test
        run: bash tests/nix-profile-reinstall-test.sh

  # tests/nix-profile-concurrency.sh, one job per shard; the count must match the script's.
  concurrency:
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-linux]
        shard: [0, 1, 2, 3, 4]
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: concurrency ${{ matrix.shard }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        id: nix
      - name: nix profile concurrency test
        timeout-minutes: 30
        run: WEBTOP_TEST_SHARD=${{ matrix.shard }}/5 bash tests/nix-profile-concurrency.sh "${{ steps.nix.outputs.nix }}"

  vm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # power: sleep freezes the session, a new client wakes it; an external stop thaws, then saves.
        test: [vm, defaults, relogin, lock, power]
        # Run outside the sandbox, so that their screenshots and logs survive a failure as an artifact.
        include:
          # Several app screens at once; summary.txt has the measured cost.
          - test: app-screens
            driver: true
          - test: second-display
            driver: true
          # Which page owns the primary display.
          - test: latest-owner
            driver: true
    name: vm (${{ matrix.test }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SYSTEM: x86_64-linux
    steps:
      - uses: actions/checkout@v7
      # The Nix daemon only offers the kvm feature if /dev/kvm exists when it starts.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A download can stall for good; a second attempt gets through.
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: build-x86_64-linux
          path: ~/build-cache
      - if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: build-x86_64-linux
          path: ~/build-cache
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/build-cache
            require-sigs = false
      - name: ${{ matrix.test }} test
        if: '!matrix.driver'
        run: nix build .#checks.$SYSTEM.${{ matrix.test }} -L
      - name: ${{ matrix.test }} test
        if: matrix.driver
        run: |
          nix build .#checks.$SYSTEM.${{ matrix.test }}.driver -L -o driver
          mkdir -p out
          ./driver/bin/nixos-test-driver -o out
      - uses: actions/upload-artifact@v4
        if: always() && matrix.driver
        with:
          name: ${{ matrix.test }}
          path: out
          if-no-files-found: ignore

  # ------ standalone image (README, "Image") ------
  image:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    name: image (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # A download can stall for good; a second attempt gets through.
      - id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        timeout-minutes: 10
        with:
          name: build-${{ matrix.system }}
          path: ~/build-cache
      - if: steps.download.outcome == 'failure'
        uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: build-${{ matrix.system }}
          path: ~/build-cache
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = file:///home/runner/build-cache
            require-sigs = false
      - name: build image
        run: nix build .#image .#image.layerSplit -L -o img
      - name: layer table
        run: |
          {
            echo "### image (${{ matrix.system }})"
            nix run .#layer-report -- img img-1/groups.json --previous "$IMAGE:main"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: load image into docker
        run: |
          nix run .#image.copyToDockerDaemon
          docker image inspect -f '{{.Architecture}}' "$IMAGE:dev"
      - name: image boot test
        timeout-minutes: 15
        run: tests/image-boot.sh "$IMAGE:dev" 600
      # Two boots on one volume with the store overlay's state edited between them, then the user's software
      # through the restore and the reinstall (needs the network to substitute).
      - name: store overlay across an image update
        timeout-minutes: 40
        run: tests/lower-swap-test.sh "$IMAGE:dev" 300
      - name: image boot diagnostics
        if: failure()
        run: |
          docker logs webtop-swap 2>&1 | tail -n 100 || true
          docker rm -f webtop-swap || true
          docker exec webtop-image systemctl --failed --no-pager || true
          docker exec webtop-image systemctl status webtop-session --no-pager -n 40 || true
          docker exec webtop-image journalctl -b --no-pager -g 'kwin|startplasma|wayland|webtop-session' 2>&1 | head -n 200 || true
          docker exec webtop-image sh -c 'findmnt -l; ls -la /run/user/1000; ps -eo user,pid,etime,args' || true
          docker exec webtop-image journalctl -b --no-pager _UID=1000 2>&1 | head -n 250 || true
          docker rm -f webtop-image || true

      # By digest (the form a consumer pins); the index job tags it. zstd at a fixed level with the pinned skopeo: the same
      # layer gives the same blob on every run, so unchanged layers are reused by digest.
      - name: push image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix run .#image.copyTo -- --dest-compress-format zstd --dest-compress-level 6 --digestfile digest \
            --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" "docker://${IMAGE}@@unknown-digest@@"
          mkdir -p out && cp digest "out/${{ matrix.system }}"
          REGISTRY_AUTH="${{ github.actor }}:${GHCR_TOKEN}" nix run .#layer-report -- img img-1/groups.json \
            --previous "$IMAGE:main" --pushed "$IMAGE@$(cat digest)" | tee -a "$GITHUB_STEP_SUMMARY" || echo "layer report failed (informational)"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.system }}
          path: out/${{ matrix.system }}

  # One multi-arch index over the per-system images, tagged main and sha-<sha7>, signed keyless. After every
  # test job, so main is tagged only when all of them pass.
  image-index:
    if: github.event_name == 'push'
    needs: [key-bar, build, nix-scripts, concurrency, vm, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create index
        id: index
        run: |
          set -euo pipefail
          args=(-t "$IMAGE:main" -t "$IMAGE:sha-${GITHUB_SHA::7}")
          for f in digests/*; do args+=("$IMAGE@$(cat "$f")"); done
          docker buildx imagetools create "${args[@]}"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image: \`$IMAGE:sha-${GITHUB_SHA::7}@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1
      - name: cosign sign (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          # Rekor/Fulcio fail transiently; retry the whole call.
          for i in 1 2 3 4 5; do
            cosign sign --recursive "$IMAGE@${{ steps.index.outputs.digest }}" && exit 0
            echo "cosign sign failed (attempt $i)"; sleep $((i * 15))
          done
          exit 1
