# tests/nix-profile-concurrency.sh with many rounds, for rare interleavings; PR CI runs few. A push to a
# concurrency-proof-* branch runs it too, to show a test fails with a fix reverted.
name: nix concurrency stress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      scenarios:
        description: Scenario names; `plain:` in front for the plain backend
        default: plain:scenario_parallel_adds scenario_parallel_adds scenario_parallel_removes scenario_mixed
      rounds:
        description: Rounds of the repeated ones
        default: '20'
  push:
    branches: ['concurrency-proof-*']

permissions:
  contents: read

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SCENARIOS: ${{ inputs.scenarios || 'plain:scenario_parallel_adds scenario_parallel_adds scenario_parallel_removes scenario_mixed' }}
      ROUNDS: ${{ inputs.rounds || '20' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nix
        id: nix
        with:
          save: 'true'
      - name: stress
        run: WEBTOP_TEST_SCENARIOS="$SCENARIOS" WEBTOP_TEST_ROUNDS="$ROUNDS" bash tests/nix-profile-concurrency.sh "${{ steps.nix.outputs.nix }}"
