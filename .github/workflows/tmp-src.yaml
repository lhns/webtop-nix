name: tmp-src
on:
  push:
    branches: [selkies-from-source]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        pkg: [pcmflux, pixelflux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: src hash
        run: |
          case ${{ matrix.pkg }} in
            pcmflux) rev=c5070c8e0a2fc34e2024a0a091901c6e49847201;;
            pixelflux) rev=67b6d833fc8eba87f9b15fb4cb3382d923a2fe56;;
          esac
          nix flake prefetch github:selkies-project/${{ matrix.pkg }}/$rev --json | tee /dev/stderr
      - name: build
        run: |
          start=$(date +%s)
          nix build .#${{ matrix.pkg }} -L --no-link
          echo "build seconds: $(( $(date +%s) - start ))"
